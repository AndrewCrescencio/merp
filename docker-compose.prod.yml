services:
  app:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL?Variable not set}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET?Variable not set}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - merp_network
    ports:
      - '127.0.0.1:3000:3000'
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    ports: []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - app
    restart: always
    networks:
      - merp_network

volumes:
  certs:
