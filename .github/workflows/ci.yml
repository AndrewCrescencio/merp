name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgres://merp:merp@localhost:5432/merp_test
  APP_DATABASE_URL: postgres://merp_app:merp_app@localhost:5432/merp_test
  DB_AVAILABLE: 'true'
  NODE_ENV: test

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:routes
      - run: npm run check:migrations

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test Suite (merp_app)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: merp
          POSTGRES_PASSWORD: merp
          POSTGRES_DB: merp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U merp -d merp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -U merp -d merp_test -h localhost -p 5432; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready after 30s"
          exit 1
      - name: Run Drizzle migrations + RLS (owner)
        run: DATABASE_URL=postgres://merp:merp@localhost:5432/merp_test npm run db:migrate:full
      - name: Run full test suite (merp_app)
        run: APP_DATABASE_URL=postgres://merp_app:merp_app@localhost:5432/merp_test DB_AVAILABLE=true npm test
