site_name: MERP Documentation
site_url: https://docs.merp.com.br
repo_url: https://github.com/Texvec/merp
repo_name: merp

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Guias:
      - getting-started:
          - 'Dev Environment — MERP': 01-getting-started/dev-environment
          - 'Quickstart — MERP': 01-getting-started/quickstart
          - 'Testing Guide — MERP': 01-getting-started/testing-guide
      - overview:
          - 'Architecture Overview — MERP': 00-overview/architecture-overview
          - 'MERP Documentation': 00-overview/README
  - Especificações:
      - 'Especificação: Auth Bounded Context': 03-domain/auth/spec
      - 'Especificação: Restaurant Pack': 06-packs/restaurant/spec
  - ADRs:
      - 'ADR Index': specs/decisions/index
      - auth:
          - '2FA Deferred': specs/decisions/ADR-010-2fa-deferred
          - 'Better Auth Drizzle Adapter Origin': specs/decisions/ADR-009-better-auth-adapter-origin
          - 'Session TTL by Profile': specs/decisions/ADR-004-session-ttl-by-profile
      - cross-cutting:
          - 'API Versioning — /api/v1 desde já': specs/decisions/ADR-005-api-versioning
          - 'Escopo de RLS — Company + Location': specs/decisions/ADR-002-location-scope
          - 'Estratégia Vertical — Núcleo Comum + Packs': specs/decisions/ADR-001-vertical-strategy
          - 'Money — numeric(12,2) vs Centavos-Inteiro': specs/decisions/ADR-003-money-numeric-vs-cents
          - 'Test Suite Runs as merp_app Role': specs/decisions/ADR-007-test-suite-runs-as-merp-app
          - 'Tipo de PK — uuid nativo (novas tabelas) / text (tabelas auth legadas)': specs/decisions/ADR-006-id-type-uuid
          - 'Vertical Slices (Package by Feature)': specs/decisions/ADR-008-vertical-slices-package-by-feature
  - Referência:
      - 'Padrões de Documentação — MERP': _meta/doc-standards
      - 'Glossário — MERP': 00-overview/glossary
  - API Reference:
      - 'API Contract: Auth': specs/001-auth-context/contracts/api-auth

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - git-authors

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Texvec/merp
