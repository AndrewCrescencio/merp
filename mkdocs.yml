site_name: MERP Documentation
site_url: https://docs.merp.com.br
repo_url: https://github.com/Texvec/merp
repo_name: merp

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Guias:
      - getting-started:
          - "Como Criar um Endpoint (handler → Repository) — MERP": 07-reference/create-endpoint-guide
          - "Dev Environment — MERP": 01-getting-started/dev-environment
          - "Quickstart — MERP": 01-getting-started/quickstart
          - "Testing Guide — MERP": 01-getting-started/testing-guide
      - overview:
          - "Architecture Overview — MERP": 00-overview/architecture-overview
          - "MERP Documentation": 00-overview/README
  - Especificações:
      - "Especificação: Auth Bounded Context": 03-domain/auth/spec
      - "Especificação: Restaurant Pack": 06-packs/restaurant/spec
  - Referência:
      - "Padrões de Documentação — MERP (MVP)": _meta/doc-standards
      - "Glossário — MERP": 00-overview/glossary
      - reference:
          - "CLI Commands — MERP": 07-reference/cli-commands
          - "Database Schema — MERP": 07-reference/database-schema
          - "Environment Variables — MERP": 07-reference/env-variables
          - "Error Codes — MERP": 07-reference/error-codes
  - Auditoria:
      - architecture:
          - "Auditoria de Simplificação — 2026-10-03": audit/2026-10-03-simplificacao-auditoria
          - "Plano de Simplificação — 2026-10-03": audit/2026-10-03-simplificacao-plano

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - git-authors

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Texvec/merp