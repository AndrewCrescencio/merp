packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nuxt/eslint-config@1.17.0'
  - '@nuxt/eslint-plugin@1.17.0'
  - '@nuxt/eslint@1.17.0'

overrides:
  '@simple-git/argv-parser@<2.0.1': ^2.0.1
  baseline-browser-mapping: ^2.11.0
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  browserslist: ^4.28.7
  devalue: ^5.9.1
  esbuild@<0.24.3: 0.25.0
  js-yaml: ^4.3.2
  minimatch@>=10.0.0 <10.2.1: ^10.2.1
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
  nanoid@<3.3.18: 3.3.18
  postcss: ^8.5.23
  shell-quote: ^1.8.5
  svgo: ^4.1.0
  tar: ^7.5.22
  valibot: ^1.4.2
