  browserslist: ^4.28.7
  devalue: ^5.9.1
  esbuild@<0.24.3: 0.25.0
  js-yaml: ^4.3.2
  nanoid@<3.3.18: 3.3.18
  postcss: ^8.5.23
  shell-quote: ^1.8.5
  svgo: ^4.1.0
  tar: ^7.5.22
  valibot: ^1.4.2
