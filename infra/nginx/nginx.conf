# AUD-10: token de reset aparece em URL (?token=...) — não logar a query
# string (logaria o token em texto plano) nem vazar em Referer.
log_format main_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer"';

# AUD-11: segunda camada de rate limit p/ endpoints de auth — a app já limita
# por email (5/min, sliding window); esta camada é por IP (5/min + burst 5
# imediato) e cobre mesmo com rotação de emails.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name app.merp.com.br;
    # AUD-12: pinning real de Host — sem default_server explícito, o nginx
    # aceita qualquer Host (o comentário AUD-11 anterior afirmava o contrário).
    # Host desconhecido é descartado sem resposta (444), antes de qualquer
    # redirect/log.
    if ($host != app.merp.com.br) {
        return 444;
    }
    # AUD-11: sem access_log próprio, este server herda o formato default do
    # http{} ("main", inclui $request com query string) — mesmo vazamento que
    # o AUD-10 evita no 443. Um link de reset acessado por http não pode
    # deixar o token no log.
    access_log /var/log/nginx/access.log main_no_query;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    # AUD-11: host explícito (domínio de produção per docs/specs) — antes
    # aceitava qualquer Host e repassava ao app. Ajustar se o deploy real
    # usar outro domínio.
    server_name app.merp.com.br;
    # AUD-12: o pinning de Host agora é real — Host desconhecido descartado
    # (444), nunca repassado ao app (evita host-poisoning futuro em links
    # derivados de Host).
    if ($host != app.merp.com.br) {
        return 444;
    }

    # Let's Encrypt certs (mounted volume)
    ssl_certificate     /etc/letsencrypt/live/merp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # AUD-11: session tickets desligados (sem estado compartilhado entre
    # instâncias); cache de sessão compartilhada entre workers.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # AUD-11: OCSP stapling — revogação checada pelo servidor, sem round-trip
    # extra do cliente. Falha de resolução do OCSP não derruba o nginx
    # (apenas não envia staple). Requer chain.pem (o certbot sempre gera).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/merp/chain.pem;

    server_tokens off;

    # AUD-11: 429 (Too Many Requests) em vez do 503 default ao estourar o
    # rate limit — herdado pelos locations com limit_req.
    limit_req_status 429;

    # app:3000 resolvido em runtime (não em load) via DNS embutido do Docker —
    # permite `nginx -t` fora da rede do compose e tolera restart do app.
    resolver 127.0.0.11 valid=10s;
    set $app_backend http://app:3000;

    # AUD-10: token de reset aparece em URL (?token=...) — não logar a query
    # string (logaria o token em texto plano) nem vazar em Referer.
    access_log /var/log/nginx/access.log main_no_query;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # AUD-10: no-referrer — o token de reset aparece em URL (?token=...) e não
    # deve vazar em Referer de navegações externas. CSP conservadora de origem
    # única; 'unsafe-inline' em style cobre estilos injetados pelo Vue.
    add_header Referrer-Policy "no-referrer" always;
    # AUD-11: browser APIs não usadas pelo app — bloqueadas
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 10m;

    # AUD-11: headers de proxy comuns a todos os locations (herdados pelo
    # nginx) — antes ficavam só em `location /`, o que obrigaria repetição
    # em /api/auth/ e /api/auth/reset-password.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sobrescreve (não concatena): proxy único atrás do app. Concatenação
    # ($proxy_add_x_forwarded_for) deixaria o primeiro IP do header
    # controlável pelo cliente, burlando rate limit por IP e IP de auditoria.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # AUD-11: substitui o hack de proxy_cookie_path (string em Path=) por
    # flags nativas do nginx (>=1.19.3). No nível server para valer também no
    # POST /api/auth/reset-password (emite sessão nova).
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # AUD-11: o GET de reset redireciona para /?token=... — a página raiz não
    # pode ser cacheada (token em query). Location exato "=": assets
    # (_nuxt/...) seguem para "location /" sem no-store. Add_headers repetidos:
    # location com add_header próprio não herda os do server (semântica nginx).
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_pass $app_backend;
    }

    location / {
        proxy_pass $app_backend;
    }

    location /api/auth/ {
        # AUD-11: rate limit por IP (segunda camada — a app limita por email)
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass $app_backend;
    }

    location /api/auth/reset-password {
        # AUD-11: token em URL (GET /api/auth/reset-password/<token> →
        # redirect ?token=...) — proíbe cache por proxy intermediário ou
        # navegador. Repete os headers de segurança do server: location com
        # add_header próprio NÃO herda os do nível acima (semântica do nginx).
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # AUD-11: mesmo rate limit dos demais endpoints de auth
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass $app_backend;
    }
}
