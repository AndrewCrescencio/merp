upstream app {
    server app:3000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Let's Encrypt certs (mounted volume)
    ssl_certificate     /etc/letsencrypt/live/merp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    # AUD-10: no-referrer — o token de reset aparece em URL (?token=...) e não
    # deve vazar em Referer de navegações externas. CSP conservadora de origem
    # única; 'unsafe-inline' em style cobre estilos injetados pelo Vue.
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não concatena): proxy único atrás do app. Concatenação
        # ($proxy_add_x_forwarded_for) deixaria o primeiro IP do header
        # controlável pelo cliente, burlando rate limit por IP e IP de auditoria.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
    }
}
