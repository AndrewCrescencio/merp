services:
  app:
    build:
      context: .
      target: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://merp:merp@db:5432/merp}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-merp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merp}
      POSTGRES_DB: ${DB_NAME:-merp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
