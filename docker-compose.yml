services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-merp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merp}
      POSTGRES_DB: ${DB_NAME:-merp}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-merp} -d ${DB_NAME:-merp}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - merp_network

volumes:
  pgdata:

networks:
  merp_network:
