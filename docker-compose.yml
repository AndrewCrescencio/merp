services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-merp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merp}
      POSTGRES_DB: ${DB_NAME:-merp}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      # PG 18+: o mount é o PAI (/var/lib/postgresql), não mais .../data —
      # o dado vai para /var/lib/postgresql/<major>/docker (layout pg_ctlcluster).
      # Volumes PG 17 não sobem no 18: o initdb do 18 recusa dados na raiz do
      # mount. Para banco local de dev/teste (sem dado que valha pg_upgrade),
      # recrie o volume:
      #   docker compose down -v && docker compose up -d postgres
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-merp} -d ${DB_NAME:-merp}']
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - merp_network

volumes:
  pgdata:

networks:
  merp_network:
