services:
  app:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL?Variable not set}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET?Variable not set}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - merp_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-merp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merp}
      POSTGRES_DB: ${DB_NAME:-merp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-merp} -d ${DB_NAME:-merp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - merp_network

volumes:
  pgdata:

networks:
  merp_network:
